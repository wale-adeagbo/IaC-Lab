name: CI

# Runs validation and linting against every push and pull request.
# Scope is intentionally "validate, don't apply" — this pipeline checks that
# the code is well-formed and internally consistent. It does not provision
# or change any real infrastructure. See README for why, and for the
# planned follow-up (ephemeral `kind` cluster for live `terraform plan`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  
jobs:
  terraform:
    name: Terraform (fmt, validate, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/kubernetes-nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend, no provider auth)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: TFLint
        run: tflint --init && tflint

  ansible:
    name: Ansible (syntax check, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible + ansible-lint
        run: pip install ansible ansible-lint

      - name: Ansible Syntax Check (playbook.yml)
        run: ansible-playbook playbook.yml --syntax-check -i inventory.ini

      - name: Ansible Syntax Check (deploy-webpage.yml)
        run: ansible-playbook deploy-webpage.yml --syntax-check -i inventory.ini

      - name: Ansible Lint
        run: ansible-lint

 terraform-plan-live:
    name: Terraform Plan (live, ephemeral kind cluster)
    runs-on: ubuntu-latest
    needs: terraform
    defaults:
      run:
        working-directory: terraform/kubernetes-nginx
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: iac-lab-ci
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
 
      - name: Terraform Init
        run: terraform init -backend=false
 
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false 2>&1 | tee plan_output.txt
        continue-on-error: true
 
      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
 
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/kubernetes-nginx/plan_output.txt', 'utf8');
            const marker = '<!-- terraform-plan-live -->';
            const maxLen = 60000;
            const body = plan.length > maxLen ? plan.slice(0, maxLen) + '\n... (truncated)' : plan;
            const commentBody = `${marker}\n### Terraform Plan (live, ephemeral \`kind\` cluster)\n\`\`\`\n${body}\n\`\`\``;
 
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
 
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
