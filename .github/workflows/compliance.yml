name: Compliance and Lint Checks

# TFLint and ansible-lint already run in ci.yml, correctly scoped to
# terraform/kubernetes-nginx and ansible/ respectively. This workflow only
# covers what ci.yml doesn't: a dedicated security/compliance scan via
# Checkov across both Terraform and Ansible.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,ansible
          quiet: true
          soft_fail: false
          output_format: cli
