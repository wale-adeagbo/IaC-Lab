name: Compliance and Lint Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform,ansible
          quiet: true
          soft_fail: false
          output_format: cli
