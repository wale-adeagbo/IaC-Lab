---
- name: Deploy custom webpage via Nginx
  hosts: local
  become: true

  tasks:
    - name: Create custom index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        mode: "0644"
        content: |
          <html>
            <head><title>IaC Lab</title></head>
            <body>
              <h1>Deployed by Ansible</h1>
              <p>This page was configured automatically using an Ansible playbook.</p>
            </body>
          </html>

    - name: Ensure Nginx is serving the page
      ansible.builtin.service:
        name: nginx
        state: restarted
